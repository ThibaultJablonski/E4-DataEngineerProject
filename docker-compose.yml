services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.6.0
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  mongo:
    image: mongo:latest
    container_name: mongo_scrapy
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  mongo_express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo_scrapy
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo


  scrapy:
    build:
      context: .
      dockerfile: scrapy/Dockerfile
    container_name: snep_scraper
    depends_on:
      - mongo
    command: ["/bin/sh", "-c", "sleep 10 && scrapy crawl certifications"] 
    working_dir: /app 
    volumes:
      - ./scrapy:/app

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: snep_webapp
    ports:
      - "8000:8000"
    depends_on:
      - elasticsearch
    volumes:
      - ./webapp:/app
      - ./data:/data
    command: >
      sh -c "sleep 30 && python import_to_elastic.py && python main.py"

volumes:
  elastic_data:
  mongo_data:
